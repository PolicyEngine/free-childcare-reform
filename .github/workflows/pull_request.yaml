name: Pull request

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (logic tests only; the pipeline needs the gated dataset)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  dashboard-build:
    name: Dashboard build and site-shell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        working-directory: dashboard
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: dashboard
        run: bun run build
      - name: Assert the page shell and provenance line are in the built HTML
        working-directory: dashboard
        run: |
          html=.next/server/app/index.html
          # The site nav and the footer link list are deliberately not rendered
          # here: this page is a single analysis, and the footer states what
          # produced the numbers instead. What must be present is the brand
          # mark and that provenance line, so a build cannot ship without
          # saying which code and which dataset produced it.
          for needle in "PolicyEngine" "Replication code" "PolicyEngine/free-childcare-reform" "policyengine.py" "Enhanced FRS"; do
            grep -qF -- "$needle" "$html" || { echo "MISSING from built HTML: $needle"; exit 1; }
          done
          echo "Brand mark and provenance line present."
