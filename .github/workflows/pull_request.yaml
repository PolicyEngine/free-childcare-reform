name: Pull request

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install from the lockfile
        # `uv sync --frozen` refuses to update uv.lock, so CI runs the exact
        # dependency set the results were generated with. `pip install -e`
        # resolved fresh versions and ignored the lock entirely.
        run: uv sync --frozen --extra dev
      - name: Check the lockfile matches pyproject
        run: uv lock --check
      - name: Lint
        run: uv run --frozen ruff check src tests
      - name: Format
        run: uv run --frozen ruff format --check src tests
      - name: Test
        run: uv run --frozen pytest -q
      - name: Assert the committed results are present and consistent
        run: uv run --frozen pytest -q tests/test_artifacts.py

  dashboard-build:
    name: Dashboard build and site-shell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        working-directory: dashboard
        run: bun install --frozen-lockfile
      - name: Assert the dashboard has data a browser can parse
        # Parsed with Bun, not Python: `json.load` accepts bare NaN and
        # Infinity, which every browser's JSON.parse rejects, so a
        # Python-only check passes files the dashboard cannot read.
        run: |
          f=dashboard/public/data/free_childcare_reform_results.json
          test -s "$f" || { echo "MISSING or empty: $f"; exit 1; }
          bun -e "
            const text = await Bun.file('$f').text();
            const data = JSON.parse(text);
            if (!data.years?.length) throw new Error('no years in results');
            for (const y of data.years) {
              const block = data.by_year[String(y)];
              if (!block?.legs?.combined?.static_cost_bn) {
                throw new Error('missing combined static cost for ' + y);
              }
            }
            console.log('results parse in a JS runtime:', data.years.join(', '));
          "
      - name: Build
        working-directory: dashboard
        run: bun run build
      - name: Assert the page shell is in the built HTML
        working-directory: dashboard
        run: |
          html=.next/server/app/index.html
          # The page is the analysis and nothing else: no site nav, no brand
          # bar, no footer. Only the title and intro are server-rendered — the
          # tabs mount once the results JSON loads — so those are what a
          # static check can assert. A broken layout fails here.
          for needle in "Childcare reform costing" "75% subsidy of childcare costs"; do
            grep -qF -- "$needle" "$html" || { echo "MISSING from built HTML: $needle"; exit 1; }
          done
          echo "Title and tabs present."
